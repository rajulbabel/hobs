# Deployment docker-compose: runs on the Pi (or inside the Pi simulator).
# This pulls pre-built images from ghcr.io — no building happens here.
# All persistent data is stored on /mnt/hdd (the external HDD).

name: immich-deploy

services:
  immich-server:
    image: ghcr.io/rajulbabel/immich-server:latest
    volumes:
      - /mnt/hdd/immich/data:/data
    env_file:
      - .env
    ports:
      - 80:2283
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false

  immich-machine-learning:
    image: ghcr.io/rajulbabel/immich-machine-learning:latest
    volumes:
      - /mnt/hdd/immich/model-cache:/cache
    env_file:
      - .env
    restart: always
    healthcheck:
      disable: false

  redis:
    image: docker.io/valkey/valkey:9
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always

  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    env_file:
      - .env
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - /mnt/hdd/immich/postgres:/var/lib/postgresql/data
    restart: always
    healthcheck:
      disable: false

  watchtower:
    image: containrrr/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_POLL_INTERVAL: 900  # 15 minutes
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_INCLUDE_STOPPED: "true"
      WATCHTOWER_ROLLING_RESTART: "true"
    restart: always
